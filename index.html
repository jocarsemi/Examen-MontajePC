<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Examen: Montaje de un PC</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--tx:#1b2333;--mut:#667;--ok:#16a34a;--bad:#dc2626;--ac:#2563eb;--bd:#d9dfec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#192032;--tx:#e8ecf5;--mut:#9aa4bd;--ok:#4ade80;--bad:#f87171;--ac:#60a5fa;--bd:#2b3550}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#192032;--tx:#e8ecf5;--mut:#9aa4bd;--ok:#4ade80;--bad:#f87171;--ac:#60a5fa;--bd:#2b3550}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:0 0 6px}h2{font-size:1.1rem}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.s{color:var(--mut)}
input{width:100%;padding:12px;font:inherit;border:2px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx);margin:8px 0}
.b{width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700;margin-top:8px;cursor:pointer}
.b:disabled{background:var(--bd);color:var(--mut)}
.b.g{background:transparent;color:var(--tx);border:2px solid var(--bd)}
.o{display:block;width:100%;text-align:left;padding:11px 12px;margin-top:8px;border:2px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx);font:inherit;cursor:pointer}
.o.on{border-color:var(--ac)}
.track{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}
.fill{height:100%;background:var(--ac)}
.big{font-size:2.4rem;font-weight:800;text-align:center;margin:4px 0}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.rv{border-top:1px solid var(--bd);padding:10px 0;font-size:.92rem}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.err{color:var(--bad);font-size:.9rem}
.ta{width:100%;font:12px ui-monospace,Menlo,monospace;background:transparent;color:var(--tx);border:2px solid var(--bd);border-radius:10px;padding:8px}
</style>
</head>
<body>
<main id="v"></main>
<script>
// [pregunta, [opciones], índice correcto, explicación]
const Q=[
["¿Qué componente se considera el «cerebro» del ordenador y ejecuta las instrucciones?",["La memoria RAM","La CPU (procesador)","La fuente de alimentación","El disco SSD"],1,"La CPU ejecuta las instrucciones y coordina al resto."],
["¿Para qué sirve la pasta térmica entre la CPU y el disipador?",["Pegar el disipador para siempre","Aislar eléctricamente la CPU","Mejorar la transferencia de calor","Reducir el consumo eléctrico"],2,"Rellena imperfecciones y ayuda a que el calor pase al disipador."],
["¿Qué es el «socket» de la placa base?",["El conector donde se instala la CPU","La ranura de la tarjeta gráfica","El puerto del monitor","El conector de la fuente"],0,"El socket (AM4, AM5, LGA1700…) debe coincidir con el de la CPU."],
["¿Qué caracteriza a la memoria RAM?",["Guarda archivos para siempre","Es temporal, rápida y se borra al apagar","Solo guarda el sistema operativo","Se instala en el slot PCIe"],1,"Guarda lo que se está usando y se vacía al apagar."],
["¿Principal diferencia entre un SSD y un HDD?",["El HDD no tiene partes móviles","El SSD solo va en portátiles","El SSD no guarda el sistema operativo","El SSD no tiene partes móviles y es más rápido"],3,"El SSD usa memoria flash: más rápido, silencioso y resistente."],
["¿Función principal de la tarjeta gráfica (GPU)?",["Procesar imágenes y vídeo para el monitor","Conectar a internet","Enfriar la CPU","Guardar archivos"],0,"La GPU está especializada en cálculos gráficos."],
["¿Qué hace la fuente de alimentación (PSU)?",["Almacena datos","Convierte corriente alterna en continua y la reparte","Controla la temperatura","Aumenta la velocidad de la CPU"],1,"Transforma los 230 V en 12 V, 5 V y 3,3 V."],
["¿Qué se consigue con Dual Channel en la RAM?",["Que no se borre al apagar","Que consuma la mitad","Mayor ancho de banda al usar dos canales","Que la CPU funcione sin disipador"],2,"Dos módulos en canales distintos transfieren más datos por segundo."],
["¿Para qué sirve el cable ATX de 24 pines?",["Alimentar la gráfica","Conectar el SSD","Conectar el teclado","Dar la alimentación principal a la placa base"],3,"Es el cable principal de la fuente hacia la placa base."],
["¿Por qué se montan CPU, RAM y disipador antes de meter la placa en la caja?",["Hay más espacio y es más fácil manipular","La caja las estropearía","Así no hace falta fuente","Lo exige el sistema operativo"],0,"Fuera de la caja se trabaja con más comodidad y menos riesgo."],
["¿Qué es el POST al encender el equipo?",["La instalación del sistema operativo","Un programa de vídeo","Un tipo de memoria","Una comprobación inicial del hardware"],3,"Power-On Self-Test: verifica los componentes básicos."],
["¿Qué se puede configurar en la BIOS/UEFI?",["El fondo de pantalla","El orden de arranque de los dispositivos","Los programas instalados","La red Wi-Fi del instituto"],1,"Ahí se elige si arranca desde SSD, USB o red."],
["¿Qué es un driver (controlador)?",["Un componente de la placa","Un tipo de cable","Un programa que permite al sistema comunicarse con un dispositivo","Una memoria de la gráfica"],2,"Sin driver, el sistema no aprovecha bien el hardware."],
["¿Qué es Ubuntu?",["Una distribución de Linux libre y gratuita","Un antivirus de pago","Una marca de procesadores","Una versión de Windows"],0,"Ubuntu es Linux de código abierto."],
["¿En qué ranura se instala una gráfica dedicada?",["En la ranura de la RAM","En el slot PCIe x16","En el socket de la CPU","En el conector SATA"],1,"El PCIe x16 es el más largo y rápido."],
["¿Qué pasa si usas RAM DDR4 en una placa solo DDR5?",["Funciona más lenta","Funciona con disipador","Funciona con la mitad","No es compatible: no encajan"],3,"DDR4 y DDR5 tienen muescas y electricidad distintas."],
["¿Cuál es únicamente un periférico de entrada?",["El altavoz","La impresora","El escáner","El monitor"],2,"El escáner solo introduce información."],
["¿Cuál es un periférico de salida?",["La impresora","El ratón","El teclado","El micrófono"],0,"La impresora muestra datos en papel; los demás los introducen."],
["¿Qué tipo de periférico es una pantalla táctil?",["Solo de salida","Solo de entrada","Mixto (entrada y salida)","De almacenamiento"],2,"Muestra información y detecta los toques."],
["¿Qué puede pasar si la fuente no da potencia suficiente?",["El PC irá más rápido","La RAM crecerá","El SO se instalará solo","Puede apagarse, reiniciarse o no arrancar"],3,"Una fuente justa falla sobre todo con CPU y GPU a tope."]
];
const $=id=>document.getElementById(id),V=$("v");
let S={},unsub=null;
const KEY="montapc_examen_resultados_v1",SALT="MontaPC-2026";
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function store(a){try{localStorage.setItem(KEY,JSON.stringify(a));return true}catch(e){return false}}
function hash(r){const t=[r.nombre,r.aciertos,r.total,r.nota,r.fecha,SALT].join("|");let h=5381;for(const c of t)h=((h<<5)+h+c.charCodeAt(0))|0;return (h>>>0).toString(36)}
function enc(r){return btoa(unescape(encodeURIComponent(JSON.stringify(r))))}
function dec(t){return JSON.parse(decodeURIComponent(escape(atob(t.trim()))))}
function add(r){if(!r||typeof r.nombre!=="string"||typeof r.aciertos!=="number"||hash(r)!==r.h)return 0;const a=load();if(a.some(x=>x.h===r.h))return -1;a.push(r);store(a);return 1}
function download(name,txt,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
const idb=()=>new Promise((res,rej)=>{const q=indexedDB.open("montapc",1);q.onupgradeneeded=()=>q.result.createObjectStore("k");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
async function kv(m,k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("k",m==="get"?"readonly":"readwrite").objectStore("k"),q=m==="get"?t.get(k):t.put(v,k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
const HDR="ALUMNO | ACIERTOS | NOTA (0-10) | FECHA";
function lines(){return load().sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(x=>`${x.nombre} | ${x.aciertos}/${x.total} | ${x.nota.toFixed(1)} | ${new Date(x.fecha).toLocaleString("es-ES")}`)}
function build(L){return "RESULTADOS DEL EXAMEN · MONTAJE DE UN PC\nActualizado: "+new Date().toLocaleString("es-ES")+"\n\n"+[HDR].concat(L).join("\n")+"\n"}
function txt(){return build(lines())}
const GK="montapc_gh";
function ghcfg(){try{return JSON.parse(localStorage.getItem(GK)||"null")}catch(e){return null}}
async function pushGH(){
 const c=ghcfg();if(!c||!c.token)return "";
 const u=`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path.split("/").map(encodeURIComponent).join("/")}`;
 const H={Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
 for(let k=0;k<3;k++){
  try{
   const g=await fetch(u+"?ref="+encodeURIComponent(c.branch),{headers:H});
   let sha,rem=[];
   if(g.ok){const j=await g.json();sha=j.sha;rem=decodeURIComponent(escape(atob(j.content.replace(/\s/g,"")))).split("\n").filter(l=>l.includes(" | ")&&l!==HDR)}
   else if(g.status!==404)return "err";
   const mine=lines().filter(l=>!rem.includes(l));
   const body={message:"Actualiza resultados del examen",content:btoa(unescape(encodeURIComponent(build(rem.concat(mine))))),branch:c.branch};
   if(sha)body.sha=sha;
   const r=await fetch(u,{method:"PUT",headers:H,body:JSON.stringify(body)});
   if(r.ok)return "ok";
   if(r.status!==409&&r.status!==422)return "err";
  }catch(e){return "err"}
 }
 return "err";
}
async function syncFile(ask){
 try{
  const h=await kv("get","fh");if(!h)return "";
  let p=await h.queryPermission({mode:"readwrite"});
  if(p!=="granted"&&ask)p=await h.requestPermission({mode:"readwrite"});
  if(p!=="granted")return "pending";
  const w=await h.createWritable();await w.write(txt());await w.close();return "ok";
 }catch(e){return ""}
}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function home(msg){
 if(unsub){unsub();unsub=null}
 V.innerHTML=`<div class="c"><h1>🖥️ Examen: montaje de un PC</h1><p class="s">20 preguntas tipo test · 4 respuestas · 1 punto por acierto · los fallos no restan.</p>
 <label>Nombre y apellidos del alumno</label><input id="nm" maxlength="60" placeholder="Ej: Lucía Pérez" value="${esc(S.nombre||"")}">
 <div class="err" id="er">${msg||""}</div><button class="b" id="st">Empezar examen</button>
 <button class="b g" id="tp">🔒 Panel del profesor</button></div>`;
 $("st").onclick=()=>{const n=$("nm").value.trim();if(n.length<3){$("er").textContent="Escribe tu nombre completo para empezar.";return}S={nombre:n,i:0,r:[]};ask()};
 $("tp").onclick=login;
}
function ask(){
 const q=Q[S.i],sel=S.r[S.i];
 V.innerHTML=`<div class="c"><div class="s">${esc(S.nombre)} · Pregunta ${S.i+1} de ${Q.length}</div><div class="track"><div class="fill" style="width:${S.i/Q.length*100}%"></div></div>
 <h2>${esc(q[0])}</h2>`+q[1].map((o,k)=>`<button class="o ${sel===k?"on":""}" data-k="${k}">${"ABCD"[k]}) ${esc(o)}</button>`).join("")+
 `<button class="b" id="nx" ${sel===undefined?"disabled":""}>${S.i===Q.length-1?"Entregar examen":"Siguiente →"}</button>
 ${S.i>0?'<button class="b g" id="pv">← Anterior</button>':""}</div>`;
 document.querySelectorAll(".o").forEach(b=>b.onclick=()=>{S.r[S.i]=+b.dataset.k;ask()});
 $("nx").onclick=()=>{S.i===Q.length-1?finish():(S.i++,ask())};
 if($("pv"))$("pv").onclick=()=>{S.i--;ask()};
}
async function finish(){
 const ac=Q.reduce((s,q,i)=>s+(S.r[i]===q[2]?1:0),0),nota=Math.round(ac/Q.length*100)/10;
 const rec={nombre:S.nombre,aciertos:ac,total:Q.length,nota,fecha:new Date().toISOString()};
 V.innerHTML=`<div class="c"><div class="big ${nota>=5?"ok":"bad"}">${nota.toFixed(1)} / 10</div><p style="text-align:center"><b>${esc(S.nombre)}</b>: ${ac} aciertos de ${Q.length} · ${nota>=5?"Aprobado ✅":"Suspenso ❌"}</p><p class="s" id="sv" style="text-align:center">Guardando resultado…</p>
 <button class="b" id="rp">Repetir examen</button></div><div class="c"><h2>Revisión</h2>`+Q.map((q,i)=>{const ok=S.r[i]===q[2];return `<div class="rv"><b>${i+1}. ${esc(q[0])}</b><br>${ok?'<span class="ok">✔ Correcta</span>':`<span class="bad">✘ Tu respuesta: ${S.r[i]===undefined?"sin responder":esc(q[1][S.r[i]])}</span><br>Correcta: ${esc(q[1][q[2]])}`}<br><span class="s">${esc(q[3])}</span></div>`}).join("")+`</div>`;
 $("rp").onclick=()=>home();
 $("sv").textContent=await save(rec);
 $("sv").insertAdjacentHTML("afterend",`<p class="s">Entrega este código a tu profesor (o descarga el archivo):</p><textarea id="cd" class="ta" readonly rows="3">${enc(rec)}</textarea><button class="b g" id="dl">⬇ Descargar archivo del resultado</button>`);
 $("cd").onclick=()=>$("cd").select();
 $("dl").onclick=()=>download("resultado_"+S.nombre.replace(/\W+/g,"_")+".json",JSON.stringify(rec),"application/json");
}
async function save(r){
 r.h=hash(r);const a=load();a.push(r);
 if(!store(a))return "⚠ No se pudo guardar en este navegador: entrega el código de abajo a tu profesor.";
 const f=await syncFile(false),g=await pushGH();
 let m="✔ Resultado guardado";
 if(f==="ok")m+=" · archivo local actualizado";
 if(f==="pending")m+=" · el profesor debe pulsar «Actualizar archivo» en su panel";
 if(g==="ok")m+=" · subido a GitHub";
 if(g==="err")m+=" · ⚠ no se pudo subir a GitHub (avisa al profesor)";
 return m+".";
}
function login(){
 V.innerHTML=`<div class="c"><h1>🔒 Panel del profesor</h1><input id="pw" type="password" inputmode="numeric" placeholder="Contraseña"><div class="err" id="er"></div><button class="b" id="ok">Entrar</button><button class="b g" id="bk">← Volver</button></div>`;
 $("bk").onclick=()=>home();
 $("ok").onclick=()=>{$("pw").value==="1111"?panel():$("er").textContent="Contraseña incorrecta."};
}
function panel(){
 V.innerHTML=`<div class="c"><h1>📋 Resultados</h1><div id="rs"></div></div>
 <div class="c"><h2>☁ Guardar en GitHub</h2><p class="s">El archivo se actualiza en tu repositorio cada vez que un alumno entrega. Usa un token de GitHub con permiso solo para este repositorio.</p>
 <input id="go" placeholder="Usuario u organización"><input id="gr" placeholder="Repositorio"><input id="gb" placeholder="Rama (main)"><input id="gp" placeholder="Ruta del archivo (resultados_examen.txt)"><input id="gt" type="password" placeholder="Token (fine-grained, Contents: lectura y escritura)">
 <button class="b" id="gs">Guardar configuración y subir ahora</button><button class="b g" id="gv2">👁 Ver el archivo publicado</button><button class="b g" id="gx">Quitar el token de este navegador</button><div class="s" id="gm"></div><pre class="ta" id="gv" style="white-space:pre-wrap;display:none"></pre></div>
 <div class="c"><h2>📄 Archivo de texto de notas</h2><p class="s">Vincula un archivo .txt y se actualizará solo cada vez que un alumno entregue (Chrome o Edge en ordenador).</p>
 <button class="b" id="fv">Elegir o crear resultados_examen.txt</button><button class="b g" id="fu">🔄 Actualizar archivo ahora</button><button class="b g" id="fd">⬇ Descargar resultados.txt</button><div class="s" id="fs"></div></div>
 <div class="c"><h2>Importar resultados de alumnos</h2><p class="s">Pega los códigos (uno por línea) o carga los archivos .json de los alumnos.</p>
 <textarea id="imp" class="ta" rows="3" placeholder="Pega aquí los códigos"></textarea><button class="b" id="ib">Importar códigos</button>
 <input type="file" id="fi" accept=".json,application/json" multiple><div class="s" id="im"></div></div>
 <div class="c"><button class="b g" id="ec">⬇ Exportar a CSV (Excel)</button><button class="b g" id="ej">⬇ Copia de seguridad (JSON)</button><button class="b g" id="bd">🗑 Borrar todos los resultados</button></div>
 <button class="b g" id="bk">← Salir del panel</button>`;
 const rep=(o,d,b)=>{$("im").textContent=`Importados: ${o} · repetidos: ${d} · no válidos: ${b}`;rs();if(o){syncFile(true);pushGH()}};
 function rs(){
  const rows=load().sort((a,b)=>b.fecha.localeCompare(a.fecha));
  if(!rows.length){$("rs").innerHTML='<p class="s">Todavía no hay resultados guardados en este navegador.</p>';return}
  const med=(rows.reduce((s,x)=>s+x.nota,0)/rows.length).toFixed(1),ap=rows.filter(x=>x.nota>=5).length;
  $("rs").innerHTML=`<p><b>${rows.length}</b> intentos · media <b>${med}</b> · aprobados <b>${ap}</b> (${Math.round(ap/rows.length*100)}%)</p><div class="tw"><table><tr><th>Alumno</th><th>Aciertos</th><th>Nota</th><th>Fecha</th></tr>`+rows.map(x=>`<tr><td>${esc(x.nombre)}</td><td>${x.aciertos}/${x.total}</td><td class="${x.nota>=5?"ok":"bad"}"><b>${x.nota.toFixed(1)}</b></td><td>${new Date(x.fecha).toLocaleString("es-ES")}</td></tr>`).join("")+`</table></div>`;
 }
 $("ib").onclick=()=>{let o=0,d=0,b=0;$("imp").value.split(/\s+/).filter(Boolean).forEach(t=>{try{const r=add(dec(t));r===1?o++:r===-1?d++:b++}catch(e){b++}});rep(o,d,b)};
 $("fi").onchange=async e=>{let o=0,d=0,b=0;for(const f of e.target.files){try{const x=JSON.parse(await f.text());for(const r of Array.isArray(x)?x:[x]){const k=add(r);k===1?o++:k===-1?d++:b++}}catch(er){b++}}rep(o,d,b)};
 $("ec").onclick=()=>{const q=t=>'"'+String(t).replace(/"/g,'""')+'"';download("resultados_examen.csv","\ufeff"+["Alumno;Aciertos;Total;Nota;Fecha"].concat(load().map(x=>[q(x.nombre),x.aciertos,x.total,String(x.nota).replace(".",","),q(new Date(x.fecha).toLocaleString("es-ES"))].join(";"))).join("\r\n"),"text/csv")};
 $("ej").onclick=()=>download("copia_resultados_examen.json",JSON.stringify(load()),"application/json");
 $("bd").onclick=()=>{if(confirm("¿Borrar todos los resultados de este navegador? Esta acción no se puede deshacer.")){store([]);rs()}};
 $("bk").onclick=()=>home();
 $("fv").onclick=async()=>{
  if(!window.showSaveFilePicker){$("fs").textContent="Este navegador no permite vincular un archivo. Usa Chrome o Edge en ordenador, o descarga el archivo con el botón de abajo.";return}
  try{const h=await showSaveFilePicker({suggestedName:"resultados_examen.txt",types:[{description:"Texto",accept:{"text/plain":[".txt"]}}]});await kv("put","fh",h);const r=await syncFile(true);$("fs").textContent=r==="ok"?"✔ Vinculado: "+h.name+". Se actualizará cada vez que un alumno entregue.":"No se pudo escribir en el archivo."}catch(e){$("fs").textContent="Operación cancelada."}
 };
 $("fu").onclick=async()=>{const r=await syncFile(true);$("fs").textContent=r==="ok"?"✔ Archivo actualizado.":r==="pending"?"El navegador no concedió permiso de escritura.":"Aún no has vinculado ningún archivo."};
 $("fd").onclick=()=>download("resultados_examen.txt",txt(),"text/plain");
 const loc=location.hostname.endsWith("github.io"),c0=ghcfg()||{};
 $("go").value=c0.owner||(loc?location.hostname.split(".")[0]:"");$("gr").value=c0.repo||(loc?location.pathname.split("/")[1]||"":"");$("gb").value=c0.branch||"main";$("gp").value=c0.path||"resultados_examen.txt";$("gt").value=c0.token||"";
 $("gs").onclick=async()=>{
  const c={owner:$("go").value.trim(),repo:$("gr").value.trim(),branch:$("gb").value.trim()||"main",path:$("gp").value.trim()||"resultados_examen.txt",token:$("gt").value.trim()};
  if(!c.owner||!c.repo||!c.token){$("gm").textContent="Completa usuario, repositorio y token.";return}
  try{localStorage.setItem(GK,JSON.stringify(c))}catch(e){}
  $("gm").textContent="Subiendo…";const r=await pushGH();
  $("gm").textContent=r==="ok"?"✔ Archivo subido a GitHub ("+c.path+"). Desde ahora se actualizará con cada examen.":"⚠ No se pudo subir. Revisa usuario, repositorio, rama, ruta y que el token tenga permiso de escritura en Contents.";
 };
 $("gv2").onclick=async()=>{
  $("gv").style.display="block";$("gv").textContent="Cargando…";
  try{const r=await fetch(new URL("resultados_examen.txt",location.href).href+"?t="+Date.now(),{cache:"no-store"});$("gv").textContent=r.ok?await r.text():"No se encontró el archivo junto a esta página (tras subirlo, GitHub Pages tarda 1-2 minutos en publicarlo)."}catch(e){$("gv").textContent="No se pudo cargar el archivo."}
 };
 $("gx").onclick=()=>{try{localStorage.removeItem(GK)}catch(e){}$("gt").value="";$("gm").textContent="Configuración y token eliminados de este navegador."};
 rs();
}
home();
</script>
</body>
</html>
